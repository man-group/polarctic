name: CI

on:
  push:
    branches: [ main, develop ]
  
  # Run checks for PRs targeting any branch, including stacked PRs
  pull_request:

  # Also allow starting a run from GitHub's Actions page
  workflow_dispatch:

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }}, Polars ${{ matrix.polars-version }})
    
    runs-on: ${{ matrix.os }}

    strategy:
    # A failure in one combination must not cancel the others
      fail-fast: false

      matrix:
        # ArcticDB uses macos-26 in its installation-test matrix
        os: [ubuntu-latest, windows-latest, macos-26]

        # Polarctic supports Python 3.10 and newer
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

        # Test both Polars dependency versions explicitly
        polars-version: ["1.35.2", "latest"]

    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Polarctic and selected Polars version
      run: |
        python -m pip install --upgrade --upgrade-strategy only-if-needed ".[dev]" "polars${{ matrix.polars-version == 'latest' && '' || format('=={0}', matrix.polars-version) }}"
        python -m pip check

    - name: Show installed versions
      run: |
        python --version
        python -m pip show arcticdb polars polars-runtime-32 pyarrow

    - name: Verify pinned Polars version
      if: matrix.polars-version != 'latest'
      run: |
        python -c "import polars; assert polars.__version__ == '${{ matrix.polars-version }}', polars.__version__"

    - name: Run all tests
      run: |
        python -c "import polars; assert polars.__version__ == '${{ matrix.polars-version }}', polars.__version__"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.os }}-python-${{ matrix.python-version }}-polars-${{ matrix.polars-version }}
        path: |
          test-results.xml
          coverage.xml
        if-no-files-found: warn

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

