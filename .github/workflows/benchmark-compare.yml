name: Benchmark Compare

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  benchmark-compare:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install polarctic
      run: |
        pip install .[dev]

    - name: Run benchmark comparison
      env:
        PYTHONHASHSEED: "0"
      run: |
        # Other scan cases remain blocked by known filtering/batching bugs
        python -m pytest tests/bench_scan_arcticdb.py tests/bench_query_translation.py -o "python_functions=bench_*" -k "(value-filter and single-read) or representative_translation" --benchmark-only -v --benchmark-json=benchmark-results.json
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results-${{ github.sha }}
        path: benchmark-results.json