name: Benchmark Compare

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  benchmark-compare:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install polarctic
      run: |
        pip install .[dev]

    - name: Run benchmark comparison
      env:
        PYTHONHASHSEED: "0"
      run: |
        # Timestamp cases remain blocked by the known filtering bug.
        python -m pytest tests/bench_scan_arcticdb.py -o "python_functions=bench_*" -k "value-filter" --benchmark-only --benchmark-json=benchmark-results.json
    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results-${{ github.sha }}
        path: benchmark-results.json